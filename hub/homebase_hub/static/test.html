<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Base hub</title>
<style>
:root{--bg:#000;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.14);--ink:#fff;--dim:rgba(235,235,245,.6);--ok:#5FD08A;--bad:#FF6B5E}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;letter-spacing:-.2px}
main{max-width:460px;margin:0 auto;padding:32px 16px 48px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:30px;letter-spacing:-.8px}h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
.sub{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3)}.dot.on{background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto}
button{border:0;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;min-height:44px;padding:0 14px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .12s,background .12s}
button:hover{background:var(--card2)}button:active{transform:scale(.96)}
button.sel{background:#fff;color:#000;font-weight:600}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px;justify-content:center}
.dpad button{border-radius:20px;padding:0}.dpad .ok{border-radius:32px;background:var(--card2);font-weight:600}
.small button{font-size:13px;padding:0 6px}
.err{color:var(--bad);font-size:13px;min-height:18px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
li{font-size:13px;color:var(--dim);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}li b{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<main>
  <div>
    <h1>Home Base hub</h1>
    <div class="sub"><span class="dot" id="link"></span><span id="linktext">Connecting…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <section>
    <div class="sub" style="margin-bottom:12px"><span class="dot" id="pdot"></span><span id="pstate">—</span></div>
    <div class="row2"><button data-act="power_on">Turn on</button><button data-act="power_off">Turn off</button></div>
    <button id="pair" data-act="pair" style="display:none;width:100%;margin-top:8px;background:#fff;color:#000;font-weight:600">Pair, then press Yes on the TV</button>
  </section>
  <section id="remote">
    <h2>Remote</h2>
    <div class="row" style="margin-bottom:14px"><button data-btn="HOME">Home</button><button data-btn="BACK">Back</button><button data-btn="EXIT">Exit</button><button data-btn="MENU">Settings</button></div>
    <div class="dpad">
      <span></span><button data-btn="UP" aria-label="Up">▲</button><span></span>
      <button data-btn="LEFT" aria-label="Left">◀</button><button class="ok" data-btn="ENTER">OK</button><button data-btn="RIGHT" aria-label="Right">▶</button>
      <span></span><button data-btn="DOWN" aria-label="Down">▼</button><span></span>
    </div>
    <div class="row" style="margin-top:14px"><button data-btn="VOLUMEDOWN">Vol −</button><button data-btn="VOLUMEUP">Vol +</button><button data-btn="MUTE">Mute</button><button data-btn="PLAY">Play</button></div>
  </section>
  <section><h2>Inputs</h2><div class="row small" id="inputs"></div></section>
  <section><h2>Apps</h2><div class="row small" id="apps"></div></section>
  <div class="err" id="err"></div>
  <section><h2>Recent</h2><ol id="log"></ol></section>
</main>
<script>
const $ = s => document.querySelector(s);
let ws, devices = {}, current = null, seq = 0;
const pending = {};

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/live');
  ws.onopen = () => { $('#link').className = 'dot on'; $('#linktext').textContent = 'Live'; };
  ws.onclose = () => { $('#link').className = 'dot'; $('#linktext').textContent = 'Reconnecting…'; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'snapshot') { devices = {}; m.devices.forEach(d => devices[d.id] = d); current = current && devices[current] ? current : (m.devices[0] || {}).id; draw(); }
    if (m.type === 'device') { devices[m.device.id] = m.device; draw(); }
    if (m.type === 'event') addLog(m.event);
    if (m.type === 'result') { $('#err').textContent = m.ok ? '' : m.error; delete pending[m.id]; }
  };
}

function send(action, arg) {
  if (!ws || ws.readyState !== 1 || !current) return;
  const id = String(++seq); pending[id] = true;
  ws.send(JSON.stringify({ type: 'command', id, device: current, action, arg, source: 'test page' }));
}

function buttons(el, items, action) {
  el.innerHTML = '';
  (items || []).forEach(i => { const b = document.createElement('button'); b.textContent = i.name; b.onclick = () => send(action, i.id); el.appendChild(b); });
}

function draw() {
  const tabs = $('#tabs'); tabs.innerHTML = '';
  Object.values(devices).forEach(d => {
    const b = document.createElement('button'); b.textContent = d.name; b.className = d.id === current ? 'sel' : '';
    b.onclick = () => { current = d.id; draw(); }; tabs.appendChild(b);
  });
  const d = devices[current]; if (!d) return;
  const on = d.power === 'on';
  $('#pdot').className = 'dot' + (on ? ' on' : '');
  const app = (d.detail && d.detail.app || '').replace(/^com\.webos\.app\./, '');
  $('#pstate').textContent = d.needs_pairing ? 'Needs pairing' + (d.reachable ? '' : ' · not reachable')
    : on ? `On · ${app}${d.detail.volume != null ? ' · vol ' + d.detail.volume : ''}${d.detail.muted ? ' · muted' : ''}`
    : d.power === 'off' ? (d.reachable ? 'Off (standby)' : 'Off or not reachable') : 'Checking…';
  $('#pair').style.display = d.needs_pairing ? '' : 'none';
  $('#remote').style.display = d.actions.includes('button') ? '' : 'none';
  buttons($('#inputs'), d.inputs, 'input');
  buttons($('#apps'), d.apps, 'launch');
}

function addLog(ev) {
  const li = document.createElement('li');
  const t = new Date(ev.ts * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  li.innerHTML = `<b></b> · <span></span>`;
  li.querySelector('b').textContent = `${ev.device} ${ev.action}${ev.arg != null ? ' ' + ev.arg : ''}${ev.ok ? '' : ' (failed)'}`;
  li.querySelector('span').textContent = `${ev.source} · ${t}`;
  $('#log').prepend(li); while ($('#log').children.length > 12) $('#log').lastChild.remove();
}

document.querySelectorAll('[data-btn]').forEach(b => b.onclick = () => send('button', b.dataset.btn));
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => send(b.dataset.act));
const keys = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Enter: 'ENTER', Backspace: 'BACK', h: 'HOME', '+': 'VOLUMEUP', '=': 'VOLUMEUP', '-': 'VOLUMEDOWN', m: 'MUTE' };
addEventListener('keydown', e => { const k = keys[e.key]; if (k) { e.preventDefault(); send('button', k); } });
fetch('/api/history?limit=12').then(r => r.json()).then(rows => rows.reverse().forEach(addLog)).catch(() => {});
connect();
</script>
</body>
</html>
