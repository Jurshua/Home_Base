<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Base hub</title>
<style>
:root{--bg:#000;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.14);--ink:#fff;--dim:rgba(235,235,245,.6);--ok:#5FD08A;--bad:#FF6B5E}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;letter-spacing:-.2px}
main{max-width:460px;margin:0 auto;padding:32px 16px 48px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:30px;letter-spacing:-.8px}h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
.sub{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3)}.dot.on{background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto}
button{border:0;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;min-height:44px;padding:0 14px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .12s,background .12s}
button:hover{background:var(--card2)}button:active{transform:scale(.96)}
button.sel{background:#fff;color:#000;font-weight:600}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px;justify-content:center}
.dpad button{border-radius:20px;padding:0}.dpad .ok{border-radius:32px;background:var(--card2);font-weight:600}
.small button{font-size:13px;padding:0 6px}
.room{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px}
.room input{grid-column:1/3;width:100%;accent-color:#fff}
.room button{min-height:32px}
.err{color:var(--bad);font-size:13px;min-height:18px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
input.code{width:100%;font:inherit;font-size:28px;letter-spacing:8px;text-align:center;background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:10px}
.big{font-size:40px;font-weight:700;letter-spacing:10px;text-align:center;padding:8px 0}
li{font-size:13px;color:var(--dim);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}li b{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<main>
  <div>
    <h1>Home Base hub</h1>
    <div class="sub"><span class="dot" id="link"></span><span id="linktext">Connecting…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <section>
    <div class="sub" style="margin-bottom:12px"><span class="dot" id="pdot"></span><span id="pstate">—</span></div>
    <div class="row2"><button data-act="power_on">Turn on</button><button data-act="power_off">Turn off</button></div>
    <button id="pair" data-act="pair" style="display:none;width:100%;margin-top:8px;background:#fff;color:#000;font-weight:600">Pair</button>
  </section>
  <section id="remote">
    <h2>Remote</h2>
    <div class="row" style="margin-bottom:14px"><button data-btn="HOME">Home</button><button data-btn="BACK">Back</button><button data-btn="EXIT">Exit</button><button data-btn="MENU">Settings</button></div>
    <div class="dpad">
      <span></span><button data-btn="UP" aria-label="Up">▲</button><span></span>
      <button data-btn="LEFT" aria-label="Left">◀</button><button class="ok" data-btn="ENTER">OK</button><button data-btn="RIGHT" aria-label="Right">▶</button>
      <span></span><button data-btn="DOWN" aria-label="Down">▼</button><span></span>
    </div>
    <div class="row" style="margin-top:14px"><button data-btn="VOLUMEDOWN">Vol −</button><button data-btn="VOLUMEUP">Vol +</button><button data-btn="MUTE">Mute</button><button data-btn="PLAY">Play</button></div>
  </section>
  <section id="inputsec"><h2>Inputs</h2><div class="row small" id="inputs"></div></section>
  <section id="lightsec"><h2>Rooms</h2><div id="rooms" style="display:flex;flex-direction:column;gap:8px"></div>
    <h2 style="margin-top:18px">Hue scenes</h2><div class="row small" id="scenes"></div></section>
  <section id="appsec"><h2>Apps</h2><div class="row small" id="apps"></div></section>
  <div class="err" id="err"></div>
  <section id="joinsec" style="display:none"><h2>Pair this device</h2>
    <p class="sub" style="margin:0 0 10px">On the Mac Mini (or any device that's already set up), open this page and press Add a device. Type the 6-digit code here.</p>
    <input class="code" id="joincode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
    <button id="joinbtn" style="width:100%;margin-top:8px;background:#fff;color:#000;font-weight:600">Pair</button></section>
  <section id="logsec"><h2>Recent</h2><ol id="log"></ol></section>
  <section id="devsec" style="display:none"><h2>Paired devices</h2>
    <div id="codebox" style="display:none"><div class="big" id="code"></div><div class="sub" id="codehint" style="justify-content:center;margin-bottom:10px"></div></div>
    <button id="addbtn" style="width:100%;margin-bottom:8px">Add a device</button>
    <ol id="clients"></ol></section>
</main>
<script>
const $ = s => document.querySelector(s);
let ws, devices = {}, current = null, seq = 0;
let token = null;
try { token = localStorage.getItem('homebase-token'); } catch (e) {}
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) } });
const pending = {};

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/live' + (token ? '?token=' + encodeURIComponent(token) : ''));
  ws.onopen = () => { $('#link').className = 'dot on'; $('#linktext').textContent = 'Live'; };
  ws.onclose = e => {
    if (e.code === 4401) { forget(); return; } $('#link').className = 'dot'; $('#linktext').textContent = 'Reconnecting…'; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'snapshot') { devices = {}; m.devices.forEach(d => devices[d.id] = d); current = current && devices[current] ? current : (m.devices[0] || {}).id; draw(); }
    if (m.type === 'device') { devices[m.device.id] = m.device; draw(); }
    if (m.type === 'event') addLog(m.event);
    if (m.type === 'result') { $('#err').textContent = m.ok ? '' : m.error; delete pending[m.id]; }
  };
}

function send(action, arg) {
  if (!ws || ws.readyState !== 1 || !current) return;
  const id = String(++seq); pending[id] = true;
  ws.send(JSON.stringify({ type: 'command', id, device: current, action, arg, source: 'test page' }));
}

function buttons(el, items, action) {
  el.innerHTML = '';
  (items || []).forEach(i => { const b = document.createElement('button'); b.textContent = i.name; b.onclick = () => send(action, i.id); el.appendChild(b); });
}

function draw() {
  const tabs = $('#tabs'); tabs.innerHTML = '';
  Object.values(devices).forEach(d => {
    const b = document.createElement('button'); b.textContent = d.name; b.className = d.id === current ? 'sel' : '';
    b.onclick = () => { current = d.id; draw(); }; tabs.appendChild(b);
  });
  const d = devices[current]; if (!d) return;
  const on = d.power === 'on';
  $('#pdot').className = 'dot' + (on ? ' on' : '');
  const app = (d.detail && d.detail.app || '').replace(/^com\.webos\.app\./, '');
  $('#pstate').textContent = d.needs_pairing ? (d.kind === 'hue_bridge' ? 'Needs pairing: press the bridge button, then Pair' : 'Needs pairing') + (d.reachable ? '' : ' · not reachable')
    : on && d.kind === 'hue_bridge' ? `On · ${(d.detail.rooms || []).filter(r => r.on).length} of ${(d.detail.rooms || []).length} rooms`
    : on ? `On · ${app}${d.detail.volume != null ? ' · vol ' + d.detail.volume : ''}${d.detail.muted ? ' · muted' : ''}`
    : d.power === 'off' ? (d.reachable ? 'Off (standby)' : 'Off or not reachable') : 'Checking…';
  $('#remote').style.display = d.actions.includes('button') ? '' : 'none';
  buttons($('#inputs'), d.inputs, 'input');
  buttons($('#apps'), d.apps, 'launch');
  const rooms = (d.detail && d.detail.rooms) || [], scenes = (d.detail && d.detail.scenes) || [];
  $('#lightsec').style.display = d.kind === 'hue_bridge' && rooms.length ? '' : 'none';
  if (d.kind === 'hue_bridge' && !document.activeElement.matches('.room input')) {
    $('#rooms').innerHTML = '';
    rooms.forEach(r => {
      const row = document.createElement('div'); row.className = 'room';
      row.innerHTML = '<span></span><button></button><input type="range" min="0" max="100">';
      row.querySelector('span').textContent = `${r.name}${r.on ? ' · ' + r.brightness + '%' : ' · off'}`;
      const b = row.querySelector('button'); b.textContent = r.on ? 'Turn off' : 'Turn on'; b.className = r.on ? 'sel' : '';
      b.onclick = () => send('room', { room: r.id, on: !r.on });
      const sl = row.querySelector('input'); sl.value = r.on ? r.brightness : 0;
      sl.onchange = () => send('room', { room: r.id, brightness: Number(sl.value) });
      $('#rooms').appendChild(row);
    });
    const names = Object.fromEntries(rooms.map(r => [r.id, r.name]));
    $('#scenes').innerHTML = '';
    scenes.forEach(sc => {
      const b = document.createElement('button'); b.textContent = `${sc.name} · ${names[sc.room] || ''}`;
      b.className = sc.active ? 'sel' : ''; b.onclick = () => send('scene', sc.id); $('#scenes').appendChild(b);
    });
  }
  $('#inputsec').style.display = (d.inputs || []).length ? '' : 'none';
  $('#appsec').style.display = (d.apps || []).length ? '' : 'none';
  document.querySelectorAll('[data-act]').forEach(b => b.style.display = d.actions.includes(b.dataset.act) && (b.dataset.act !== 'pair' || d.needs_pairing) ? '' : 'none');
}

function addLog(ev) {
  const li = document.createElement('li');
  const t = new Date(ev.ts * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  li.innerHTML = `<b></b> · <span></span>`;
  li.querySelector('b').textContent = `${ev.device} ${ev.action}${ev.arg != null ? ' ' + ev.arg : ''}${ev.ok ? '' : ' (failed)'}`;
  li.querySelector('span').textContent = `${ev.source} · ${t}`;
  $('#log').prepend(li); while ($('#log').children.length > 12) $('#log').lastChild.remove();
}

document.querySelectorAll('[data-btn]').forEach(b => b.onclick = () => send('button', b.dataset.btn));
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => send(b.dataset.act));
const keys = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', Enter: 'ENTER', Backspace: 'BACK', h: 'HOME', '+': 'VOLUMEUP', '=': 'VOLUMEUP', '-': 'VOLUMEDOWN', m: 'MUTE' };
addEventListener('keydown', e => { const k = keys[e.key]; if (k) { e.preventDefault(); send('button', k); } });
function forget() {
  token = null; try { localStorage.removeItem('homebase-token'); } catch (e) {}
  $('#link').className = 'dot'; $('#linktext').textContent = 'Not paired';
  document.querySelectorAll('main > section').forEach(s => s.style.display = 'none');
  $('#tabs').style.display = 'none'; $('#joinsec').style.display = '';
}

$('#joinbtn').onclick = async () => {
  const name = prompt('Name this device', /iPhone|iPad|Android|Windows|Mac/.exec(navigator.userAgent)?.[0] || 'Browser');
  if (!name) return;
  const r = await api('/api/pair', { method: 'POST', body: JSON.stringify({ code: $('#joincode').value, name }) });
  const j = await r.json();
  if (!r.ok) { $('#err').textContent = j.detail; return; }
  token = j.token; try { localStorage.setItem('homebase-token', token); } catch (e) {}
  location.reload();
};

let codeTimer;
$('#addbtn').onclick = async () => {
  const j = await (await api('/api/pairing-codes', { method: 'POST' })).json();
  $('#code').textContent = j.code; $('#codebox').style.display = '';
  clearInterval(codeTimer);
  const tick = () => {
    const left = Math.round(j.expires - Date.now() / 1000);
    if (left <= 0) { $('#codebox').style.display = 'none'; clearInterval(codeTimer); loadClients(); return; }
    $('#codehint').textContent = `Type this on the new device · ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} left`;
  };
  tick(); codeTimer = setInterval(() => { tick(); loadClients(); }, 1000);
};

let shown = '';
async function loadClients() {
  const rows = await (await api('/api/clients')).json();
  const key = JSON.stringify(rows.map(c => c.id)); if (key === shown) return;
  if (shown && $('#codebox').style.display === '') { $('#codebox').style.display = 'none'; clearInterval(codeTimer); }  // the code was just used
  shown = key;
  $('#clients').innerHTML = rows.length ? '' : '<li>None yet</li>';
  rows.forEach(c => {
    const li = document.createElement('li'); li.style.display = 'flex'; li.style.alignItems = 'center'; li.style.gap = '8px';
    li.innerHTML = '<b style="flex:1"></b><button style="min-height:32px">Remove</button>';
    li.querySelector('b').textContent = c.name + (c.id === me.id ? ' (this one)' : '');
    li.querySelector('button').onclick = async () => { if (confirm(`Remove ${c.name}? It will need a new code to connect again.`)) { await api('/api/clients/' + c.id, { method: 'DELETE' }); shown = ''; loadClients(); } };
    $('#clients').appendChild(li);
  });
}

let me = {};
api('/api/me').then(async r => {
  if (r.status === 401) return forget();
  me = await r.json();
  $('#devsec').style.display = '';
  loadClients();
  api('/api/history?limit=12').then(r => r.json()).then(rows => rows.reverse().forEach(addLog)).catch(() => {});
  connect();
});
</script>
</body>
</html>
